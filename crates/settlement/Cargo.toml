[package]
name = "zwa-settlement"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Pranav-1116/ZWA-protocol"
description = "Milestone 3 for ZWA Protocol: RFQ terms, independent party authorization and the immutable ApprovedSettlement handoff to Milestone 4. No transaction construction, submission or private keys."
readme = "README.md"

[dependencies]
zwa-matcher = { path = "../../matcher", version = "0.1.0" }
zwa-protocol = { path = "../protocol", version = "0.1.0" }
zwa-commitments = { path = "../commitments", version = "0.1.0" }
thiserror = { workspace = true }
ed25519-dalek = { version = "2.1.1" }
getrandom = "0.2"
sha2 = { workspace = true }

[dev-dependencies]
zwa-credentials = { path = "../credentials", version = "0.1.0" }

[lints]
workspace = true
